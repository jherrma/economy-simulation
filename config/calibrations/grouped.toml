# The grouped calibration — `02-PARAMETERS.md` §3.6.
#
# Eighteen goods, three per category, each with its own life and price. This is a **second
# calibration, not a replacement**: §3.1's six rows stay the default, so every number in
# `01-SIMULATION.md` §10 keeps its referent. A finding whose calibration was replaced underneath it
# is a finding nobody can check.
#
# `replace = true` is why this file can exist at all. The goods table is otherwise an *overlay* —
# `[categories.food]` edits food and leaves the other five alone — so without it these eighteen rows
# would load as twenty-four, six of them §3.1's, and `Sum price_ref / life` would come to 1,300
# against a mean income of 650. The run would start, produce numbers, and look like the one that was
# asked for.
#
# `category` is a **label** and nothing else. Rows sharing it are a category; the engine never
# branches on it; it decides how the output rolls up (a reader can hold an electronics price index
# in their head, not a laptop one) and, from §3.5, the level at which archetype taste is authored.
# Splitting a category is a redistribution of its budget, never an addition to it: the four durable
# categories were reweighted within their EUR 150 (`01-SIMULATION.md` §5.5).
#
# Row names are globally unique and readable alone, because each becomes an output column
# (`abstainer_appliance_large_wanted`). §3.6's table calls them "small", "medium", "large" within a
# category; here they carry the category where the bare word would not survive being read on its own.
#
# `capacity` is omitted throughout: it is `round(households / life)` by definition and the loader
# derives it, so this table is independent of how big the town is. §3.6 asks for 5,000 households on
# the thin-shelf evidence, and that belongs to the scenario rather than to the goods table.
#
# `base_score` is what this table authors, and `v` is **derived**: `v_g = base_score_g *
# price_ref_g / (life_g * mean_income)`. Nobody has an intuition about `v = 0.0141`; everybody has
# one about "this good scores 1.24 at the mean income", because that says directly where the good
# sits relative to lambda, and the tier a median household reaches follows by arithmetic off the
# tier table: x 1.133 for the budget unit, x 0.800 for the standard upgrade, x 0.500 for premium.
# So the authored number is the one a reader can disagree with and the derived number is the one
# the engine uses. `v` may still be written down, and if it is it must equal the derived value or
# the run is refused — the rule `capacity` already obeys. §3.6's four-decimal `v` column is a
# rounding of these: it sums to 1.2557 where the exact table sums to 1.2555, which is the argument
# for the derivation living in the loader rather than in a person's calculator.
#
# Nominal neutrality survives it (V3): `price_ref` and `mean_income` are both money and scale
# together, so `v` is invariant under a change of unit.

# `households` and `min_shelf_units` are here rather than in a scenario because they are facts about
# *this* goods table. Eighteen goods split the same capacity eighteen ways and then three ways again
# by tier, so the shelves are thin where the lives are long: at 1,000 households four premium shelves
# hold three units or fewer and the large-appliance one holds **one**. A shelf reprices on its own,
# so a shelf of one unit produces a price series that looks exactly like data and is a coin toss.
#
# The floor of 7 is what forces 5,000, not the other way round. The threshold is 4,680 households —
# below that the large-appliance premium shelf drops to six — and 5,000 is the nearest round thousand
# above it. The binding shelf is large appliances, at exactly 7 units. The `[categories]` table below
# still states no `capacity` and stays independent of the town's size — the loader derives it — which
# is the distinction §3.6 draws.

[run]
households      = 5000
min_shelf_units = 7
# §1: the grouped calibration requires the hazard. Its lives are all integers, so the calendar would
# *run* — and §3.7's per-archetype cycles would then have nowhere to land, because a deterministic
# life is an integer count of ticks. Stating it here rather than in each scenario keeps the
# calibration one file that means one town.
replacement     = "hazard"

# `warmup_ticks` and `ticks` are **measured on the null run, not inherited** — the same rule that set
# §3.1's 240, applied again rather than assumed to carry over. It does not carry over: at 240 the
# worst shelf drifts -7.4% across the measured window on average over 30 seeds, and at 480 it still
# drifts -2.4%, both far past the 1.0% their own spread across seeds can explain.
#
# The offender is `eating_out.budget` and its transient is *systematic*, not noise: every seed drifts
# the same way, with a seed spread of 0.7% around a mean of -5.3% at tick 300. Eating out is the good
# with the highest entry income in the table (EUR 592, §3.6), so almost nobody wants it at the opening
# price and the shelf falls a long way before demand meets it. Probed on ten long runs the decay has a
# time constant near 210 ticks: -40.8% at tick 0, -5.3% at 300, -3.1% at 420, -1.5% at 600, and
# inside its own seed spread from about tick 700. The probe chose 840; V4 on thirty complete seeds
# confirmed it, at a worst tier-price drift of -0.727% against the 1.00% allowed.
#
# 1,200 = 840 + the 360-tick measured window §10 reads its results off.
warmup_ticks    = 840
ticks           = 1200

[categories]
replace = true

