# typed_credit_high — the four archetypes of §3.5, level and steepness together.
#
# Credit on, `theta ~ U(0.4, 0.9)` — the treatment `credit_high` applies, over this table.
#
# This is the treatment table of the sweep. Read the two rows of a type together: `prudent` cares
# less about quality everywhere, `health_conscious` buys the best food rather than more food,
# `gadget` wants far more hobby and electronics *and* wants them good, `family_practical` wants more
# clothing and appliances and wants them durable rather than fine.
#
# The weights are **relative**: the loader divides each `w` column by its share-weighted mean, so
# that `Sum_A share_A * m_g,A = 1` holds by construction, and writes the normalised table into the
# effective configuration — which is what the campaign manifest hashes. An absent category means
# 1.0, so a type names only the categories it differs in; a *misspelt* category is an error.
#
# This table is a hypothesis about a population and nothing in this repository can calibrate it. It
# inherits the rule that governs the tier mix: a table adjusted until the headline came out better
# would turn this model from evidence into an illustration. It is swept, not fitted, and the sweep
# was named before the first typed run (`02-PARAMETERS.md` §3.5).

[credit]
credit_enabled = true
theta_min = 0.4
theta_max = 0.9

[archetypes.prudent]
share = 0.30
w     = { food = 0.90, leisure = 0.80, clothing = 0.85, hobby = 0.75, electronics = 0.80, appliances = 0.90 }
kappa = { food = 0.85, leisure = 0.85, clothing = 0.85, hobby = 0.85, electronics = 0.85, appliances = 0.85 }

[archetypes.health_conscious]
share = 0.20
w     = { food = 1.20, hobby = 0.90, electronics = 0.85, appliances = 1.05 }
kappa = { food = 1.25, leisure = 0.95, clothing = 0.95, hobby = 0.95, electronics = 0.95, appliances = 1.10 }

[archetypes.gadget]
share = 0.20
w     = { food = 0.95, leisure = 1.15, clothing = 1.05, hobby = 1.55, electronics = 1.60 }
kappa = { food = 0.95, leisure = 1.05, clothing = 0.95, hobby = 1.20, electronics = 1.25, appliances = 0.95 }

[archetypes.family_practical]
share = 0.30
w     = { food = 1.05, clothing = 1.15, hobby = 0.95, appliances = 1.10 }
kappa = { food = 0.90, leisure = 0.90, clothing = 0.95, hobby = 0.90, electronics = 0.90, appliances = 0.90 }
