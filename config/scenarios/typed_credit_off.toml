# typed_credit_off — the four archetypes of spec/02-PARAMETERS.md §3.5, credit still off.
#
# This is the control arm for every typed scenario, and it is a *different baseline economy* from
# the untyped one: the population-mean `kappa` under this table is 0.92–0.965 in every category, so
# the town is shifted toward the budget shelves before credit is mentioned at all. A typed treatment
# arm compared against the untyped `credit_off` would measure the table and the credit together and
# attribute both to credit. Compare typed against typed.
#
# The weights below are **relative**. The loader divides each column by its share-weighted mean, so
# that `Σ_A share_A · m_g,A = 1` holds by construction, and writes the normalised table into the
# effective configuration — which is what the campaign manifest hashes. Writing a table that already
# averages to one by hand is arithmetic busywork that hides what the author meant.
#
# An absent category means 1.0, so a type names only the categories it differs in. A *misspelt*
# category is an error.

[archetypes.prudent]
share = 0.30
w     = { food = 0.90, leisure = 0.80, clothing = 0.85, hobby = 0.75, electronics = 0.80, appliances = 0.90 }
kappa = { food = 0.85, leisure = 0.85, clothing = 0.85, hobby = 0.85, electronics = 0.85, appliances = 0.85 }

[archetypes.health_conscious]
share = 0.20
w     = { food = 1.20, hobby = 0.90, electronics = 0.85, appliances = 1.05 }
kappa = { food = 1.25, leisure = 0.95, clothing = 0.95, hobby = 0.95, electronics = 0.95, appliances = 1.10 }

[archetypes.gadget]
share = 0.20
w     = { food = 0.95, leisure = 1.15, clothing = 1.05, hobby = 1.55, electronics = 1.60 }
kappa = { food = 0.95, leisure = 1.05, clothing = 0.95, hobby = 1.20, electronics = 1.25, appliances = 0.95 }

[archetypes.family_practical]
share = 0.30
w     = { food = 1.05, clothing = 1.15, hobby = 0.95, appliances = 1.10 }
kappa = { food = 0.90, leisure = 0.90, clothing = 0.95, hobby = 0.90, electronics = 0.90, appliances = 0.90 }
