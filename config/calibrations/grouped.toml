# ---- electronics: EUR 45.00 per tick, up from §3.1's 25.00 -------------------------------------
#
# A EUR 600 phone every thirty months is EUR 20 a month on its own, four fifths of what §3.1 allotted
# the whole category. This is the clearest case for the split, and it is about falsifiability rather
# than realism: "EUR 900 every 36 months" is a number nobody can look at and call wrong, and "a
