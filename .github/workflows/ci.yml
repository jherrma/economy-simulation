# Build, tests, and the validation gates.
#
# The gates run here rather than only on a laptop because what they protect is comparability across
# versions: a change that makes this month's model run on a different random world from last
# month's is invisible in a diff and fatal to every result the project has published.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: build
        run: dotnet build -c Release -warnaserror

      - name: test
        run: dotnet test -c Release --no-build

      # V2. Short by design — 48 ticks on four seeds — so that it can run on every push rather
      # than on the occasions someone remembers to.
      - name: gate — determinism (V2)
        run: dotnet run --project tools/Gates -c Release --no-build -- determinism

      # V3. Longer than V2 — it needs a measured window, so it runs the full length on eight
      # seeds — and about a minute.
      - name: gate — nominal neutrality (V3)
        run: dotnet run --project tools/Gates -c Release --no-build -- neutrality

      # V4. The full seed set, because a baseline that sits still on four seeds and drifts on the
      # fifth is a baseline that drifts. About twenty seconds.
      - name: gate — the null run (V4)
        run: dotnet run --project tools/Gates -c Release --no-build -- nullrun

      # V5. The measurement instrument: until this holds, the difference between credit on and
      # credit off is not the attributed effect of credit. Seconds.
      - name: gate — credit-off regression (V5)
        run: dotnet run --project tools/Gates -c Release --no-build -- creditoff

      # V5a. The same claim for the archetype machinery, which has no switch: it is off when the
      # table is the identity. Compared against a fixture taken before E10 existed, and that
      # fixture is never regenerated — see tools/Gates/baselines/archetypes/provenance.toml.
      # Seconds.
      - name: gate — the identity archetype table (V5a)
        run: dotnet run --project tools/Gates -c Release --no-build -- archetypes

      # The campaign itself: thirteen scenarios over thirty seeds, one process each, collected into
      # one dataset. It runs here because it is the only thing in the project that has to work end
      # to end, and because a collector that has quietly stopped refusing partial runs looks exactly
      # like one that works. About three minutes since E10 added the typed sweep — four tables times
      # two arms on top of the five of §9.
      - name: campaign
        run: dotnet run --project tools/Campaign -c Release --no-build -- --all

      # Provenance is the point of the manifest, so a campaign that produced one without a commit
      # in it has produced a dataset nobody can cite.
      - name: manifest
        run: |
          cat campaign/manifest.toml
          grep -q 'engine_commit = "[0-9a-f]\{40\}"' campaign/manifest.toml
